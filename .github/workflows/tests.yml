name: Tests

# Runs every test in /tests (engine, importers, offline rules) on each pull request.
on:
  pull_request:

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # No `npm install`: the tests use only Node built-ins and the files in /vendor.
      - name: Run all tests
        run: node tests/run-tests.js
